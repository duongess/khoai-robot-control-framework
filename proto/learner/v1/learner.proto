syntax = "proto3";

package learner.v1;

import "learner/v1/environment.proto";
import "learner/v1/transition.proto";

option go_package = "github.com/duongess/khoai-robot-control-framework/gen/go/learner/v1;learnerv1";

message PredictBatchRequest {
  EnvironmentDescriptor environment = 1;
  repeated State states = 2;
  uint64 policy_version = 3;
}

message PredictBatchResponse {
  repeated Action actions = 1;
  uint64 policy_version = 2;
}

message TrainBatchRequest {
  TransitionBatch batch = 1;
  uint64 policy_version = 2;
}

message TrainBatchResponse {
  bool accepted = 1;
  uint64 samples_seen = 2;
  uint64 policy_version = 3;
  float actor_loss = 4;
  float critic_loss = 5;
  float alpha_loss = 6;
  float entropy = 7;
  uint64 training_step = 8;
  float critic_one_q = 9;
  float critic_two_q = 10;
  float alpha = 11;
  float actor_log_std_horizontal = 12;
  float actor_log_std_vertical = 13;
  float actor_log_std_gripper = 14;
}

message HealthCheckRequest {}

message HealthCheckResponse {
  bool ready = 1;
  uint64 policy_version = 2;
  uint64 training_step = 3;
  string device = 4;
  // Empty when this process is a new, unsaved learner.
  string model_name = 5;
}

// SaveCheckpoint persists the complete SAC training state. `model_name` may
// be omitted only after a learner was started with `python -m ai <name>`; in
// that case the active name is overwritten. Model names are identifiers, not
// file paths, so a local dashboard cannot write outside the checkpoint root.
message SaveCheckpointRequest {
}

message SaveCheckpointResponse {
  string model_name = 1;
  uint64 policy_version = 2;
  uint64 training_step = 3;
}

service LearnerService {
  rpc PredictBatch(PredictBatchRequest) returns (PredictBatchResponse);
  rpc TrainBatch(TrainBatchRequest) returns (TrainBatchResponse);
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
  rpc SaveCheckpoint(SaveCheckpointRequest) returns (SaveCheckpointResponse);
}
